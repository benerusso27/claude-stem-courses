<svg role="img" aria-labelledby="fig-title fig-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="368.46pt" height="240.022109pt" viewBox="0 0 368.46 240.022109" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id=\"fig-title\">Figure 1. Tension-test setup</title>
 <desc id="fig-desc">Schematic of a universal testing machine. A moving crosshead at the top, carrying a load cell, travels upward along two screw columns at a set rate while the base stays fixed. Wedge grips hold the threaded or shouldered ends of a round specimen. A clip-on extensometer with a 50.0 mm gage length is attached to the narrow reduced section, whose initial diameter is 10.00 mm. An arrow labeled P shows the tensile load measured by the load cell.</desc>
