<svg role="img" aria-labelledby="fig-title fig-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="365.390526pt" height="166.536pt" viewBox="0 0 365.390526 166.536" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id=\"fig-title\">Figure 4. Thermal stress in a bolted joint</title>
 <desc id="fig-desc">Three panels. (a) Unconstrained, a heated aluminum sleeve would grow more than the steel bolt, since its coefficient of expansion is larger. (b) Clamped by the head and nut, both end at the same length: the bolt is stretched into tension F and the sleeve squeezed into compression minus F. (c) Compatibility: the bolt's thermal plus mechanical elongation equals the sleeve's, which gives the change in bolt force per degree as alpha sleeve minus alpha bolt times L, divided by the sum of the two flexibilities L over E A.</desc>
