<svg role="img" aria-labelledby="fig-title fig-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="368.615909pt" height="156.548232pt" viewBox="0 0 368.615909 156.548232" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id=\"fig-title\">Figure 4. Anticlastic curvature and the shape factor</title>
 <desc id="fig-desc">Two panels. (a) A rectangular cross-section of a beam bent with positive moment: the compressed top widens and the stretched bottom narrows because of Poisson's effect, so the section curves the other way with a transverse radius of rho over nu. (b) Fully plastic stress blocks of plus and minus the yield stress next to a rectangle and an I-section: the rectangle's plastic moment is 1.5 times its yield moment, while the I-section, whose material is already concentrated in the flanges, gains only about 10 to 20 percent.</desc>
