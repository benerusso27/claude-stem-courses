<svg role="img" aria-labelledby="fig-title fig-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="368.46pt" height="143.931429pt" viewBox="0 0 368.46 143.931429" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id=\"fig-title\">Figure 1. Four-point bending set-up</title>
 <desc id="fig-desc">A beam rests on two supports 600 millimeters apart. A spreader beam on top applies two equal loads P over 2 at 200 millimeters from each support, so the middle 200 millimeters carry a constant moment. At midspan five strain gages run up the side face, with one more on the top face and one on the bottom face; two bottom gages sit in the left outer span at 100 and 150 millimeters from the support. Insets show the cross-sections: a 25.4 by 50.8 millimeter 6061-T6 bar for Parts A and C, and the same bar with a steel strip bonded to its bottom for Part B.</desc>
