<svg role="img" aria-labelledby="fig-title fig-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="358.469pt" height="176.096437pt" viewBox="0 0 358.469 176.096437" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id=\"fig-title\">Figure 2. Mohr's circles at the top of the tube</title>
 <desc id="fig-desc">Two Mohr's circles drawn to equal scales, without numbers. (a) Stress at point H with the load on the lever: point X, for the face normal to the tube axis, lies to the right of the origin and above the sigma axis because its shear stress turns the element clockwise; point Y lies at the origin's abscissa, below the axis; the circle crosses the sigma axis at A (sigma max, tensile) and B (slightly compressive), and the angle 2 theta p from CX to CA is marked. (b) The corresponding Mohr's circle for strain (epsilon against gamma over 2): the readings of gages a, b and c are the abscissas of three points on the circle at twice their angles from the x axis; squares a-prime, b-prime and c-prime show the same rosette turned by 8 degrees, whose points slide around the same circle, so the principal strains do not change but each reading does.</desc>
