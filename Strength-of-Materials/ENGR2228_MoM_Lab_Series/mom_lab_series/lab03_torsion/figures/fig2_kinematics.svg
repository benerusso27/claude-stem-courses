<svg role="img" aria-labelledby="fig-title fig-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="374.121447pt" height="139.386316pt" viewBox="0 0 374.121447 139.386316" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id=\"fig-title\">Figure 2. Kinematics and stresses in a twisted circular shaft</title>
 <desc id="fig-desc">Three sketches. (a) A circular shaft of length L: a straight line on its surface becomes a helix when one end rotates by phi, so the surface shear strain is gamma; in general gamma equals rho times phi over L, linear in the radius rho. (b) Elastic shear stress on the cross-section, drawn as arrows that grow linearly from zero at the center to the maximum Tc over J at the surface. (c) A small element on the surface is in pure shear tau; the same element rotated 45 degrees carries a tensile normal stress plus tau on one diagonal and a compressive normal stress minus tau on the other, with no shear.</desc>
