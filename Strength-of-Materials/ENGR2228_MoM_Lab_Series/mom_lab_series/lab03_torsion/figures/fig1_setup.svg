<svg role="img" aria-labelledby="fig-title fig-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="369.846289pt" height="150.84pt" viewBox="0 0 369.846289 150.84" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id=\"fig-title\">Figure 1. Torsion test set-up</title>
 <desc id="fig-desc">Schematic of a torsion tester. A round specimen with hexagonal ends is held between a fixed head that contains the torque cell on the left and a drive head with a rotation encoder on the right. Its reduced section is 6.35 millimeters in diameter and 76.2 millimeters long. Two collars of a troptometer are clamped 50.8 millimeters apart on the reduced section and measure the angle of twist phi over that gage length. Torque vectors drawn as double-headed arrows along the axis show the applied torque T at the drive head and the reaction T prime at the fixed head.</desc>
