 <title id=\"fig-title\">Figure 4. Fracture modes in torsion</title>
 <desc id="fig-desc">Two sketches. (a) A ductile shaft breaks on a flat plane perpendicular to its axis, the plane of maximum shear stress. (b) A brittle shaft such as gray cast iron breaks along a helical surface at 45 degrees to the axis, perpendicular to the maximum tensile stress, which in pure shear equals tau.</desc>
